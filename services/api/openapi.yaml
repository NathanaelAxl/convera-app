openapi: 3.1.0

info:
  title: Convera API
  version: 0.1.0
  description: |
    Kontrak REST API Convera, diterjemahkan dari PRD.md bagian 7.

    Konvensi (PRD 7.1):
    - JSON `snake_case`, waktu ISO 8601 UTC, tanggal `YYYY-MM-DD` (Asia/Jakarta), uang berupa angka dalam IDR.
    - Respons sukses dibungkus `{ "data": ... }`; daftar berpaginasi menambah `meta`.
    - Respons error memakai `{ "error": { "code", "message", "details" } }`.
    - Autentikasi lewat cookie httpOnly `access_token` (JWT 15 menit) dan `refresh_token` (30 hari).
    - Request mutasi (POST/PUT/PATCH/DELETE) wajib mengirim header `X-CSRF-Token` yang sama dengan cookie `csrf_token`,
      termasuk endpoint publik (login, register, lupa/reset password). Cookie `csrf_token` (bukan httpOnly) dipasang oleh
      `GET /auth/csrf`; klien memanggilnya otomatis bila cookie belum ada. Token tidak ada atau tidak valid dijawab
      403 `CSRF_INVALID`; klien lalu mengambil token baru lewat `GET /auth/csrf` sekali dan mengulang request.
    - `{slug}` adalah `projects.slug`; proyek yang tidak ada atau bukan milik user dijawab 404.

    Endpoint fitur ditambahkan per fitur.

servers:
  - url: /api/v1

security:
  - cookieAuth: []

tags:
  - name: auth
    description: Autentikasi (PRD 7.2)
  - name: account
    description: Akun (PRD 7.3)
  - name: projects
    description: Proyek (PRD 7.4)
  - name: settings
    description: Pengaturan proyek, Meta CAPI & koneksi WhatsApp (PRD 7.5)
  - name: mapping
    description: Event Mapping (PRD 7.6)

paths:
  /auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrfToken
      summary: Pasang cookie csrf_token untuk double-submit CSRF
      description: |
        Publik. Memasang cookie `csrf_token` (acak, bukan httpOnly agar bisa dibaca JavaScript, `SameSite=Lax`,
        `Secure` di produksi, `Path=/`). Klien memanggil endpoint ini sebelum request mutasi pertama bila cookie
        `csrf_token` belum ada, lalu mengirim nilainya di header `X-CSRF-Token`.
        Selalu memasang nilai baru, juga bila cookie sudah ada: klien memanggilnya lagi setelah menerima 403
        `CSRF_INVALID`.
      security: []
      responses:
        "204":
          description: Cookie `csrf_token` dipasang lewat header `Set-Cookie`.
          headers:
            Set-Cookie:
              description: "`csrf_token=<nilai acak>; Path=/; SameSite=Lax; Secure`"
              schema:
                type: string

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Daftar akun baru dan langsung masuk
      description: |
        Catatan backend:
        - Password di-hash dengan argon2id, bukan bcrypt. bcrypt memotong input di 72 byte, padahal password boleh
          sampai 128 karakter (lihat skema `Password`).
        - Wajib diberi rate limit per IP, karena respons 409 memberi tahu apakah sebuah email sudah terdaftar
          (enumerasi akun). Angkanya belum ada di NFR-12; usulan awal 10 permintaan per jam per IP.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Akun dibuat dan cookie sesi dipasang.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "409":
          $ref: "#/components/responses/Conflict"
          description: Email sudah terdaftar (`CONFLICT`, `details` berisi field `email`).
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: Rate limit per IP untuk mencegah enumerasi email lewat respons 409.

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Masuk dengan email dan password
      description: |
        Catatan backend: verifikasi password dengan argon2id (lihat `POST /auth/register`). Untuk email yang tidak
        terdaftar, tetap jalankan verifikasi argon2id terhadap hash tiruan agar waktu respons tidak membocorkan
        apakah email terdaftar.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Berhasil, cookie sesi dipasang.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/LoggedInUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
          description: Email atau password salah. Pesannya umum agar tidak membocorkan email yang terdaftar.
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: Lebih dari 5 percobaan dalam 15 menit per IP + email (NFR-12).

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Perbarui access token memakai cookie refresh_token
      security:
        - refreshCookie: []
          csrfToken: []
      responses:
        "200":
          description: Token baru dipasang di cookie.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/RefreshResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfInvalid"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Cabut sesi dan hapus cookie
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "204":
          description: Sesi dicabut dan cookie dihapus.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfInvalid"

  /auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Minta tautan reset password lewat email
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Selalu sama, baik email terdaftar maupun tidak. Tautan berlaku 60 menit dan sekali pakai.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MessageResult"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: Lebih dari 3 permintaan per jam per email (NFR-12).

  /auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Ganti password memakai token dari tautan reset
      description: "Catatan backend: password baru di-hash dengan argon2id, bukan bcrypt (bcrypt memotong input di 72 byte)."
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password diganti dan semua sesi dicabut.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ResetPasswordResult"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: Token tidak valid, kedaluwarsa, atau sudah dipakai (`BAD_REQUEST`).
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "422":
          $ref: "#/components/responses/ValidationError"

  /me:
    get:
      tags: [account]
      operationId: getMe
      summary: Data user yang sedang login
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/password:
    put:
      tags: [account]
      operationId: changePassword
      summary: Ganti password; sesi lain dicabut, sesi saat ini tetap aktif
      description: "Catatan backend: password baru di-hash dengan argon2id, bukan bcrypt (bcrypt memotong input di 72 byte)."
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password diganti dan sesi lain dicabut.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "422":
          $ref: "#/components/responses/ValidationError"
          description: Password lama salah (`details` berisi field `current_password`) atau password baru tidak memenuhi syarat.

  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: Daftar proyek milik user
      description: Semua proyek milik user yang sedang login, tanpa paginasi, urut `created_at` terbaru dulu.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [projects]
      operationId: createProject
      summary: Buat proyek baru cukup dengan nama
      description: |
        Saat dibuat, server menyiapkan:
        - `slug` dari nama (FR-07, FR-08). Aturan (frontend memakai aturan yang sama untuk pratinjau, `lib/projects.ts`):
          1. Normalisasi Unicode NFKD lalu buang tanda diakritik (kategori Unicode `M`), misalnya `é` → `e`.
          2. Huruf kecil.
          3. Setiap deret karakter selain `a-z` dan `0-9` menjadi satu `-`.
          4. `-` di awal dan akhir dibuang.
          5. Dipotong maksimal 100 karakter, lalu `-` di akhir dibuang lagi.
          6. Bila hasilnya kosong (nama tanpa huruf/angka Latin), slug dasar = `proyek`.
          7. Slug unik secara global (termasuk proyek milik user lain); bila sudah dipakai, tambahkan `-2`, `-3`, dan
             seterusnya [asumsi FR-08]. Slug tidak pernah berubah setelah proyek dibuat.
        - `webhook_key` acak 32 karakter `[A-Za-z0-9]` dari CSPRNG (unik).
        - Slot event default (Event Mapping AC 4 [asumsi]): Contact aktif, Lead, InitiateCheckout, dan Purchase tidak aktif.
        - Nilai default kolom lain sesuai PRD 6.3 (`business_category` = `general`, `wa_connection_type` = `waba`,
          `wa_provider` = `generic`, trial 7 hari).

        Catatan backend: `name` di-trim sebelum divalidasi dan disimpan. Rate limit untuk 429 belum ada di NFR-12;
        usulan awal 30 proyek per jam per user.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Proyek dibuat. `slug` di respons adalah slug final (bisa bersufiks `-2`, `-3`, ...).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "422":
          $ref: "#/components/responses/ValidationError"
          description: Nama kosong atau lebih dari 100 karakter (`details` berisi field `name`).
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /projects/{slug}:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    get:
      tags: [projects]
      operationId: getProject
      summary: Detail proyek milik user
      description: Proyek yang tidak ada atau milik user lain dijawab 404, bukan 403 (FR-13).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ProjectDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: Hapus proyek permanen beserta seluruh datanya
      description: |
        User wajib mengetik ulang nama proyek (Manajemen Proyek AC 6 [asumsi]). `confirm_name` dibandingkan dengan
        `projects.name` setelah keduanya di-trim, peka huruf besar/kecil. Semua data turunan ikut terhapus lewat
        `ON DELETE CASCADE` (kontak, event, slot, blacklist, sesi landing page, insight iklan, dst.).
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteProjectRequest"
      responses:
        "204":
          description: Proyek dan semua data turunannya dihapus.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
          description: Nama konfirmasi kosong atau tidak cocok (`details` berisi field `confirm_name`).

  /projects/{slug}/status:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    patch:
      tags: [projects]
      operationId: updateProjectStatus
      summary: Nonaktifkan atau aktifkan kembali proyek
      description: |
        Proyek nonaktif tetap bisa dibuka dan diatur, tetapi webhook dijawab 200 tanpa diproses (FR-11, UF-02 langkah 5).
        Mengirim nilai yang sama dengan status sekarang tetap 200 (idempoten).
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectStatusRequest"
      responses:
        "200":
          description: Status diperbarui.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ProjectStatusResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
          description: "`is_active` tidak ada atau bukan boolean (`details` berisi field `is_active`)."

  /projects/{slug}/settings:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    get:
      tags: [settings]
      operationId: getProjectSettings
      summary: Pengaturan proyek (info proyek, Meta CAPI, koneksi WhatsApp)
      description: |
        Access Token CAPI dan Webhook Secret tidak pernah dikembalikan utuh (NFR-09): token hanya sebagai
        `capi_access_token_masked` (8 karakter `•` + 4 karakter terakhir), secret hanya sebagai `has_webhook_secret`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ProjectSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [settings]
      operationId: updateProjectSettings
      summary: Simpan semua pengaturan proyek sekaligus
      description: |
        Semua kartu di halaman Pengaturan disimpan bersama (FR-10, FR-14, FR-15, FR-17, FR-19).
        - `capi_access_token` dan `webhook_secret`: dihilangkan, `null`, atau string kosong = nilai lama tetap
          (AC 2: field token yang dibiarkan kosong tidak menghapus token lama). Nilai baru disimpan terenkripsi
          AES-256-GCM ke `capi_access_token_enc` / `webhook_secret_enc` dan tidak ditulis ke log.
        - `pixel_id` dan `test_event_code`: `null` atau string kosong = dikosongkan (UF-01 langkah 11: Test Event
          Code dikosongkan saat proyek live).
        - Semua string di-trim dulu sebelum divalidasi dan disimpan.
        - Validasi gagal → 422, tidak ada yang tersimpan; `details` berisi satu pesan per field.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectSettingsRequest"
      responses:
        "200":
          description: Tersimpan. Objek yang sama seperti `GET /settings`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ProjectSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
          description: |
            Misalnya Pixel ID bukan angka atau panjangnya di luar 10–20 digit, provider tidak dikenal, atau
            `wa_connection_type` = `qr` sebelum Fase 5. `details[].field` memakai nama field request.

  /projects/{slug}/settings/test-capi:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    post:
      tags: [settings]
      operationId: testProjectCapi
      summary: Kirim satu event uji ke Meta CAPI
      description: |
        FR-18 [asumsi]. Memakai Pixel ID, Access Token, dan Test Event Code yang sudah tersimpan (bukan isi form
        yang belum disimpan). Jawaban Meta, berhasil maupun ditolak, dikembalikan sebagai 200; `message` berisi
        pesan error dari Meta. Bila `test_event_code` kosong, event dikirim tanpa kode uji
        (`used_test_event_code` = `null`) sehingga tercatat sebagai event biasa di Events Manager.

        Catatan backend [usulan, perlu konfirmasi]: karena jawaban Meta harus langsung tampil, event uji dikirim
        oleh API (bukan worker) dan tidak dicatat di `events`.

        Catatan backend [usulan rate limit, belum ada di NFR-12]: 5 permintaan per menit per proyek; lebih dari itu
        dijawab 429 `RATE_LIMITED`. Alasannya, setiap klik "Uji koneksi" memanggil API Meta.
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "200":
          description: Jawaban Meta (berhasil maupun ditolak).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/TestCapiResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionExpired"
          description: Proyek terkunci karena trial atau langganan habis [asumsi PRD 7.1].
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
          description: Pixel ID atau Access Token belum tersimpan (`details` berisi field `pixel_id` dan/atau `capi_access_token`).
        "429":
          $ref: "#/components/responses/TooManyRequests"
          description: Lebih dari 5 uji per menit untuk proyek yang sama (`RATE_LIMITED`) [usulan].
        "502":
          $ref: "#/components/responses/ExternalServiceError"
          description: Meta tidak bisa dihubungi (timeout, error jaringan, atau 5xx dari Meta).

  /projects/{slug}/settings/webhook-secret:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    post:
      tags: [settings]
      operationId: createProjectWebhookSecret
      summary: Buat Webhook Secret baru (mode generik)
      description: |
        FR-17. Secret baru langsung menggantikan secret lama; webhook yang masih ditandatangani dengan secret lama
        dijawab 401. Secret utuh hanya ada di respons ini (AC 5) dan tidak ditulis ke log.
        Format: `whsec_` + 32 karakter `[A-Za-z0-9]` dari CSPRNG.
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        "201":
          description: Secret dibuat dan disimpan terenkripsi.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/WebhookSecretResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{slug}/event-slots:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    get:
      tags: [mapping]
      operationId: listEventSlots
      summary: Daftar slot Event Mapping, urut sesuai funnel
      description: |
        FR-20–FR-24. Diurutkan menurut `position` (mulai 1). Proyek baru sudah punya 4 slot default (AC 4 [asumsi]):
        Contact aktif (pengirim customer, tanpa keyword), lalu Lead, InitiateCheckout, dan Purchase tidak aktif
        sebagai templat.

        Field Fase 2 di contoh PRD 7.6 (`min_chat`, `scoring_enabled`, `score_mode`, `score_threshold`,
        `scoring_keywords`) ditambahkan di Fase 2 (Lead Scoring & Chat Minimum); sampai saat itu kolomnya memakai
        default database dan tidak dikirim.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventSlot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [mapping]
      operationId: updateEventSlots
      summary: Simpan seluruh slot sekaligus (atomik)
      description: |
        Menyimpan seluruh slot dalam satu transaksi (AC 5): slot dengan `id` diperbarui dan ID-nya tetap (AC 6,
        riwayat event tetap terhubung lewat `events.slot_id`), slot tanpa `id` dibuat, slot milik proyek yang tidak
        dikirim dihapus (`events.slot_id` menjadi NULL). `position` mengikuti urutan array, mulai 1.

        Aturan validasi (semua string di-trim dulu). Satu pesan per field; `details[].field` memakai format
        `slots[<indeks>].<field>`, indeks mulai 0, misalnya `slots[1].custom_event_name`.
        - `slots`: maksimal 20 slot [usulan, PRD belum menetapkan batas]; boleh kosong.
        - `id`: harus slot milik proyek ini dan tidak boleh muncul dua kali ("Slot tidak ditemukan. Muat ulang
          halaman lalu coba lagi." / "Slot ini muncul lebih dari sekali.").
        - `custom_event_name`: wajib bila `meta_event` = `CustomEvent` ("Nama custom event wajib diisi."), hanya
          huruf, angka, dan underscore, maksimal 50 karakter (AC 2 [asumsi]). Untuk event lain diabaikan dan
          disimpan `null`.
        - `trigger_keywords`: kosong = semua pesan (FR-22); dicocokkan tanpa membedakan huruf besar/kecil.
          Maksimal 20 keyword per slot, tiap keyword 1–100 karakter, tidak boleh ada yang sama (tanpa membedakan
          huruf besar/kecil) [usulan batas].
        - `value_mode`: event bernilai (glosarium PRD 1.6) adalah Purchase, AddPaymentInfo, AddToCart,
          AddToWishlist, StartTrial, Subscribe, dan CustomEvent.
          - Event tidak bernilai wajib `none` ("Cara mengambil nilai hanya untuk event bernilai.").
          - Event standar bernilai wajib `auto`, `keyword`, atau `fixed` ("Pilih cara mengambil nilai.")
            [usulan: Meta mewajibkan `value` untuk Purchase]. CustomEvent boleh `none` (contoh PRD 7.6).
          - `keyword` mewajibkan minimal satu keyword trigger; error dipasang di field `trigger_keywords`
            ("Isi minimal satu keyword trigger untuk mengambil angka setelah keyword.").
        - `fixed_value`: wajib dan > 0 bila `value_mode` = `fixed` (AC 3), maksimal 999.999.999.999,99 dan 2
          angka desimal (`NUMERIC(14,2)`). Untuk mode lain diabaikan dan disimpan `null`.

        Field Fase 2 (`min_chat`, scoring) belum diterima; bila dikirim diabaikan.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventSlotsRequest"
      responses:
        "200":
          description: Tersimpan. Daftar slot terbaru dengan format yang sama seperti `GET /event-slots`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventSlot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfInvalid"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
          description: |
            Ada slot yang tidak valid; tidak ada perubahan yang tersimpan (AC 5). Contoh `details`:
            `{ "field": "slots[1].custom_event_name", "message": "Nama custom event wajib diisi." }`.
            Error untuk daftar secara keseluruhan memakai field `slots`.

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: JWT 15 menit, cookie httpOnly.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Refresh token 30 hari, cookie httpOnly, di-rotate setiap dipakai.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Wajib untuk POST/PUT/PATCH/DELETE, termasuk endpoint publik; nilainya sama dengan cookie `csrf_token`
        (double-submit, cookie dipasang `GET /auth/csrf`). Header tidak ada, tidak sama dengan cookie, atau token
        tidak valid → 403 `CSRF_INVALID` (bukan `FORBIDDEN`, agar klien tahu cukup mengambil token baru lalu
        mengulang request).

  parameters:
    ProjectSlug:
      name: slug
      in: path
      required: true
      description: "`projects.slug`"
      schema:
        type: string
        maxLength: 120
    Period:
      name: period
      in: query
      required: false
      description: Preset periode. Untuk `custom`, `from` dan `to` wajib (maksimal 366 hari).
      schema:
        $ref: "#/components/schemas/Period"
    PeriodFrom:
      name: from
      in: query
      required: false
      description: Tanggal awal (Asia/Jakarta), wajib bila `period=custom`.
      schema:
        type: string
        format: date
    PeriodTo:
      name: to
      in: query
      required: false
      description: Tanggal akhir (Asia/Jakarta), wajib bila `period=custom`.
      schema:
        type: string
        format: date
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  responses:
    BadRequest:
      description: Format request salah (`BAD_REQUEST`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Belum login, sesi kedaluwarsa, atau signature salah (`UNAUTHORIZED`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SubscriptionExpired:
      description: Langganan proyek habis (`SUBSCRIPTION_EXPIRED`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Bukan admin (`FORBIDDEN`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CsrfInvalid:
      description: Header `X-CSRF-Token` tidak ada, tidak sama dengan cookie `csrf_token`, atau token tidak valid (`CSRF_INVALID`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Tidak ditemukan, termasuk proyek milik user lain (`NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Konflik atau duplikat (`CONFLICT`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: File atau payload terlalu besar (`PAYLOAD_TOO_LARGE`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: Tipe file tidak didukung (`UNSUPPORTED_MEDIA_TYPE`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Validasi gagal (`VALIDATION_ERROR`), detail per field di `error.details`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limit (`RATE_LIMITED`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Error server yang tidak terduga (`INTERNAL_ERROR`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ExternalServiceError:
      description: Layanan eksternal gagal (`EXTERNAL_SERVICE_ERROR`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorCode:
      type: string
      description: |
        Sumber tunggal kode error API. Backend hanya boleh mengirim kode di daftar ini;
        kode baru ditambahkan di sini dulu, lalu tipe frontend di-generate ulang.
        - `BAD_REQUEST` (400): format request salah, misalnya JSON rusak.
        - `UNAUTHORIZED` (401): belum login, sesi kedaluwarsa, atau refresh token tidak valid.
        - `SUBSCRIPTION_EXPIRED` (402): langganan proyek habis.
        - `FORBIDDEN` (403): bukan admin.
        - `CSRF_INVALID` (403): token CSRF tidak ada atau tidak valid; klien mengambil token baru lalu mengulang request.
        - `NOT_FOUND` (404): tidak ditemukan, termasuk proyek milik user lain.
        - `CONFLICT` (409): konflik atau duplikat.
        - `PAYLOAD_TOO_LARGE` (413): file atau payload terlalu besar.
        - `UNSUPPORTED_MEDIA_TYPE` (415): tipe file tidak didukung.
        - `VALIDATION_ERROR` (422): validasi gagal, detail per field di `details`.
        - `RATE_LIMITED` (429): terlalu banyak permintaan.
        - `INTERNAL_ERROR` (500): error server yang tidak terduga.
        - `EXTERNAL_SERVICE_ERROR` (502): layanan eksternal (Meta, SMTP, dll.) gagal.
      enum:
        - BAD_REQUEST
        - UNAUTHORIZED
        - SUBSCRIPTION_EXPIRED
        - FORBIDDEN
        - CSRF_INVALID
        - NOT_FOUND
        - CONFLICT
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - VALIDATION_ERROR
        - RATE_LIMITED
        - INTERNAL_ERROR
        - EXTERNAL_SERVICE_ERROR

    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: pixel_id
        message:
          type: string
          example: Pixel ID hanya boleh berisi angka.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          example: Data tidak valid.
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"

    PaginationMeta:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 50
        total:
          type: integer
          example: 1
        total_pages:
          type: integer
          example: 1

    Period:
      type: string
      enum:
        - today
        - yesterday
        - last_3_days
        - last_7_days
        - last_14_days
        - last_30_days
        - last_90_days
        - this_week
        - last_week
        - this_month
        - last_month
        - custom

    UserRole:
      type: string
      enum: [user, admin]

    BusinessCategory:
      type: string
      enum: [general, health, ecommerce, education, property, fnb, service, travel, finance]

    WaConnectionType:
      type: string
      enum: [waba, qr]

    SubscriptionStatus:
      type: string
      enum: [trial, active, expired]

    RefreshResult:
      type: object
      required: [refreshed]
      properties:
        refreshed:
          type: boolean
          example: true

    UserProfile:
      type: object
      required: [id, name, email, phone, role]
      properties:
        id:
          type: string
          format: uuid
          example: 5b1c8f4e-2a7d-4c1e-9a0b-1f2e3d4c5b6a
        name:
          type: string
          maxLength: 100
          example: Rina Saputri
        email:
          type: string
          format: email
          example: rina@contoh.id
        phone:
          type: string
          description: Format 62xxxxxxxxxx.
          example: "6281234567890"
        role:
          $ref: "#/components/schemas/UserRole"

    User:
      description: Respons `GET /me` dan `POST /auth/register`.
      allOf:
        - $ref: "#/components/schemas/UserProfile"
        - type: object
          required: [created_at]
          properties:
            created_at:
              type: string
              format: date-time
              example: "2026-11-02T03:15:00Z"

    LoggedInUser:
      description: Respons `POST /auth/login`.
      allOf:
        - $ref: "#/components/schemas/UserProfile"
        - type: object
          required: [last_login_at]
          properties:
            last_login_at:
              type: string
              format: date-time
              example: "2026-11-02T03:20:00Z"

    Password:
      type: string
      minLength: 8
      maxLength: 128
      description: |
        Minimal 8 karakter [asumsi FR-01], maksimal 128. Disimpan sebagai hash argon2id (NFR-07), bukan bcrypt,
        karena bcrypt memotong input di 72 byte.

    RegisterRequest:
      type: object
      required: [name, email, phone, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Rina Saputri
        email:
          type: string
          format: email
          maxLength: 254
          example: rina@contoh.id
        phone:
          type: string
          maxLength: 20
          description: |
            Boleh berformat 08xx, 62xx, atau +62, dengan spasi, titik, tanda hubung, atau kurung.
            Server menormalkan ke `62xxxxxxxxxx` (62 + 8–13 digit).
          example: "081234567890"
        password:
          $ref: "#/components/schemas/Password"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: rina@contoh.id
        password:
          type: string
          minLength: 1
          maxLength: 128
          example: rahasia-kuat-123

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: rina@contoh.id

    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
          minLength: 1
          example: q9Xc3...tokendaritautan
        new_password:
          $ref: "#/components/schemas/Password"

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
          example: rahasia-kuat-123
        new_password:
          $ref: "#/components/schemas/Password"

    MessageResult:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Jika email terdaftar, tautan reset sudah dikirim.

    ResetPasswordResult:
      type: object
      required: [reset]
      properties:
        reset:
          type: boolean
          example: true

    Project:
      type: object
      required:
        - id
        - name
        - slug
        - business_category
        - is_active
        - wa_connection_type
        - wa_provider
        - webhook_url
        - subscription_status
        - trial_ends_at
        - subscription_ends_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
          example: 0f8e2c1a-6b3d-4f5e-8a9b-7c6d5e4f3a2b
        name:
          type: string
          maxLength: 100
          example: Toko Dummy & Co. 2026!
        slug:
          type: string
          maxLength: 120
          example: toko-dummy-co-2026
        business_category:
          $ref: "#/components/schemas/BusinessCategory"
        is_active:
          type: boolean
          example: true
        wa_connection_type:
          $ref: "#/components/schemas/WaConnectionType"
        wa_provider:
          type: string
          maxLength: 30
          example: generic
        webhook_url:
          type: string
          format: uri
          example: https://api.example.com/api/v1/webhooks/wa/k7Qm2xPz9LwR4tVb8NcY1sDf6GhJ3aEu
        subscription_status:
          $ref: "#/components/schemas/SubscriptionStatus"
        trial_ends_at:
          type: string
          format: date-time
          example: "2026-11-09T03:16:00Z"
        subscription_ends_at:
          type: ["string", "null"]
          format: date-time
          example: null
        created_at:
          type: string
          format: date-time
          example: "2026-11-02T03:16:00Z"

    ProjectDetail:
      description: Respons `GET /projects/{slug}`, objek `Project` ditambah status setup.
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [is_locked, has_capi_access_token, pixel_id, setup_complete]
          properties:
            is_locked:
              type: boolean
              description: Trial atau langganan habis (Fase 3).
              example: false
            has_capi_access_token:
              type: boolean
              example: true
            pixel_id:
              type: ["string", "null"]
              pattern: "^[0-9]+$"
              maxLength: 20
              example: "123456789012345"
            setup_complete:
              type: boolean
              description: Pixel ID dan Access Token terisi, dan sudah ada pesan masuk serta event sukses.
              example: false

    ProjectName:
      type: string
      minLength: 1
      maxLength: 100
      description: Di-trim dulu; kosong atau lebih dari 100 karakter ditolak.
      example: Toko Dummy & Co. 2026!

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/ProjectName"

    UpdateProjectStatusRequest:
      type: object
      required: [is_active]
      properties:
        is_active:
          type: boolean
          example: false

    ProjectStatusResult:
      type: object
      required: [slug, is_active, updated_at]
      properties:
        slug:
          type: string
          maxLength: 120
          example: toko-dummy-co-2026
        is_active:
          type: boolean
          example: false
        updated_at:
          type: string
          format: date-time
          example: "2026-11-02T04:00:00Z"

    DeleteProjectRequest:
      type: object
      required: [confirm_name]
      properties:
        confirm_name:
          type: string
          minLength: 1
          maxLength: 100
          description: Harus sama dengan nama proyek (keduanya di-trim, peka huruf besar/kecil).
          example: Toko Dummy & Co. 2026!

    WaProvider:
      type: string
      maxLength: 30
      description: |
        Kode adapter provider WABA (`projects.wa_provider`). Hanya mode generik sampai Pertanyaan Terbuka 2
        diputuskan; adapter lain ditambahkan ke enum ini.
      enum: [generic]

    PixelId:
      type: string
      pattern: "^([0-9]{10,20})?$"
      description: |
        Hanya angka, 10–20 digit (default Pertanyaan Terbuka 3). Di-trim dulu.
        Pesan error: bukan angka → "Pixel ID hanya boleh berisi angka."; panjang di luar batas →
        "Pixel ID harus 10 sampai 20 digit."
      example: "123456789012345"

    TestEventCode:
      type: string
      pattern: "^[A-Za-z0-9]*$"
      maxLength: 50
      description: Kode dari Meta Events Manager, hanya huruf dan angka. Di-trim dulu.
      example: TEST48213

    ProjectSettings:
      type: object
      description: |
        Respons `GET` dan `PUT /projects/{slug}/settings`. Field `tracker_snippet` di contoh PRD 7.5 ditambahkan di
        Fase 2 (Tracker Landing Page).
      required:
        - name
        - business_category
        - pixel_id
        - has_capi_access_token
        - capi_access_token_masked
        - test_event_code
        - wa_connection_type
        - wa_provider
        - webhook_url
        - has_webhook_secret
      properties:
        name:
          type: string
          maxLength: 100
          example: Toko Dummy & Co. 2026!
        business_category:
          $ref: "#/components/schemas/BusinessCategory"
        pixel_id:
          type: ["string", "null"]
          pattern: "^[0-9]{10,20}$"
          example: "123456789012345"
        has_capi_access_token:
          type: boolean
          example: true
        capi_access_token_masked:
          type: ["string", "null"]
          description: |
            8 karakter `•` + 4 karakter terakhir token (AC 2); `null` bila belum ada token. Token yang lebih pendek
            dari 16 karakter hanya ditampilkan sebagai `••••••••` agar tidak terbuka hampir utuh.
          example: ••••••••Zx9a
        test_event_code:
          type: ["string", "null"]
          maxLength: 50
          example: TEST48213
        wa_connection_type:
          $ref: "#/components/schemas/WaConnectionType"
        wa_provider:
          $ref: "#/components/schemas/WaProvider"
        webhook_url:
          type: string
          format: uri
          example: https://api.example.com/api/v1/webhooks/wa/k7Qm2xPz9LwR4tVb8NcY1sDf6GhJ3aEu
        has_webhook_secret:
          type: boolean
          example: true

    UpdateProjectSettingsRequest:
      type: object
      required: [name, business_category, pixel_id, test_event_code, wa_connection_type, wa_provider]
      properties:
        name:
          $ref: "#/components/schemas/ProjectName"
        business_category:
          $ref: "#/components/schemas/BusinessCategory"
        pixel_id:
          description: "`null` atau string kosong = dikosongkan."
          oneOf:
            - $ref: "#/components/schemas/PixelId"
            - type: "null"
        capi_access_token:
          type: ["string", "null"]
          maxLength: 1000
          pattern: "^\\S*$"
          description: |
            Token baru. Dihilangkan, `null`, atau string kosong = token lama tetap (AC 2). Tanpa spasi, maksimal
            1.000 karakter. Pesan error: "Access Token tidak boleh mengandung spasi." /
            "Access Token maksimal 1000 karakter."
          example: EAAG...tokenbaru
        test_event_code:
          description: "`null` atau string kosong = dikosongkan. Pesan error: \"Test Event Code hanya boleh berisi huruf dan angka.\" / \"Test Event Code maksimal 50 karakter.\""
          oneOf:
            - $ref: "#/components/schemas/TestEventCode"
            - type: "null"
        wa_connection_type:
          $ref: "#/components/schemas/WaConnectionType"
          description: "`qr` ditolak 422 (\"Koneksi lewat scan QR belum tersedia.\") sampai Fase 5."
        wa_provider:
          $ref: "#/components/schemas/WaProvider"
          description: Nilai di luar enum ditolak 422 ("Provider tidak dikenal.").
        webhook_secret:
          type: ["string", "null"]
          maxLength: 256
          pattern: "^(\\S{16,256})?$"
          description: |
            Secret dari provider. Dihilangkan, `null`, atau string kosong = secret lama tetap. Bila diisi: 16–256
            karakter tanpa spasi [usulan, PRD belum menetapkan batas]. Pesan error: "Webhook Secret minimal 16
            karakter." / "Webhook Secret maksimal 256 karakter." / "Webhook Secret tidak boleh mengandung spasi."
          example: null

    TestCapiResult:
      type: object
      required: [success, events_received, fbtrace_id, message, used_test_event_code]
      properties:
        success:
          type: boolean
          example: true
        events_received:
          type: integer
          minimum: 0
          description: "`events_received` dari jawaban Meta; 0 bila ditolak."
          example: 1
        fbtrace_id:
          type: ["string", "null"]
          description: ID jejak dari Meta untuk dilaporkan ke dukungan Meta; `null` bila Meta tidak mengirimkannya.
          example: AbC12dEfG3h
        message:
          type: ["string", "null"]
          description: Pesan error dari Meta bila ditolak; `null` bila berhasil.
          example: null
        used_test_event_code:
          type: ["string", "null"]
          description: Test Event Code yang dipakai; `null` bila dikirim tanpa kode uji.
          example: TEST48213

    WebhookSecretResult:
      type: object
      required: [webhook_secret, has_webhook_secret]
      properties:
        webhook_secret:
          type: string
          pattern: "^whsec_[A-Za-z0-9]{32}$"
          description: Secret utuh, hanya ditampilkan sekali.
          example: whsec_4Jd8Kq2Lm7Np1Rs5Tv9Xz3Bc6Fh0Gk
        has_webhook_secret:
          type: boolean
          example: true

    MetaEvent:
      type: string
      description: |
        `event_slots.meta_event` (CHECK di PRD 6.2): 16 event standar Meta, atau `CustomEvent` dengan nama di
        `custom_event_name`. Nilai lain ditolak 422 ("Pilih event Meta.").
      enum:
        - Contact
        - Lead
        - InitiateCheckout
        - Purchase
        - CompleteRegistration
        - AddToCart
        - AddToWishlist
        - AddPaymentInfo
        - Search
        - ViewContent
        - Subscribe
        - StartTrial
        - SubmitApplication
        - Schedule
        - FindLocation
        - CustomizeProduct
        - CustomEvent

    SlotSender:
      type: string
      description: Filter pengirim pesan yang boleh memicu slot (FR-23). `both` = Keduanya (default).
      enum: [customer, cs, both]

    ValueMode:
      type: string
      description: |
        Cara mengambil nilai uang dari pesan (FR-24): `none` tanpa nilai, `auto` angka terbesar di pesan
        (mendukung `1.250.000`, `1,25 jt`, `250rb`, `250k`), `keyword` angka pertama tepat setelah keyword trigger
        yang cocok, `fixed` selalu `fixed_value`.
      enum: [none, auto, keyword, fixed]

    EventSlot:
      type: object
      description: |
        Satu baris `event_slots`. Field Fase 2 di contoh PRD 7.6 (`min_chat`, `scoring_enabled`, `score_mode`,
        `score_threshold`, `scoring_keywords`) ditambahkan di Fase 2.
      required:
        - id
        - position
        - is_active
        - meta_event
        - custom_event_name
        - trigger_keywords
        - sender
        - value_mode
        - fixed_value
      properties:
        id:
          type: string
          format: uuid
          example: a1f3c9d2-4b5e-4c6d-8e7f-9a0b1c2d3e4f
        position:
          type: integer
          minimum: 1
          description: Urutan funnel, mulai 1.
          example: 1
        is_active:
          type: boolean
          example: true
        meta_event:
          $ref: "#/components/schemas/MetaEvent"
        custom_event_name:
          type: ["string", "null"]
          pattern: "^[A-Za-z0-9_]{1,50}$"
          description: Terisi hanya bila `meta_event` = `CustomEvent`.
          example: null
        trigger_keywords:
          type: array
          maxItems: 20
          description: Kosong = semua pesan.
          items:
            type: string
            minLength: 1
            maxLength: 100
          example: []
        sender:
          $ref: "#/components/schemas/SlotSender"
        value_mode:
          $ref: "#/components/schemas/ValueMode"
        fixed_value:
          type: ["number", "null"]
          description: Nominal IDR; terisi hanya bila `value_mode` = `fixed`.
          example: null

    EventSlotInput:
      type: object
      description: |
        Satu slot di `PUT /event-slots`. Tanpa `id` (atau `null`) = slot baru. Aturan validasi lengkap ada di
        deskripsi endpoint.
      required: [is_active, meta_event, trigger_keywords, sender, value_mode]
      properties:
        id:
          type: ["string", "null"]
          format: uuid
          example: a1f3c9d2-4b5e-4c6d-8e7f-9a0b1c2d3e4f
        is_active:
          type: boolean
          example: true
        meta_event:
          $ref: "#/components/schemas/MetaEvent"
        custom_event_name:
          type: ["string", "null"]
          maxLength: 50
          description: |
            Wajib bila `meta_event` = `CustomEvent`: huruf, angka, dan underscore, maksimal 50 karakter. Pesan
            error: "Nama custom event wajib diisi." / "Nama custom event hanya boleh berisi huruf, angka, dan
            underscore." / "Nama custom event maksimal 50 karakter."
          example: TanyaOngkir
        trigger_keywords:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 100
          description: |
            Pesan error (field `trigger_keywords`): "Keyword tidak boleh kosong." / "Keyword maksimal 100
            karakter." / "Maksimal 20 keyword per slot." / "Keyword \"harga\" ditulis lebih dari sekali."
          example: [ongkir, ongkos kirim]
        sender:
          $ref: "#/components/schemas/SlotSender"
        value_mode:
          $ref: "#/components/schemas/ValueMode"
        fixed_value:
          type: ["number", "null"]
          maximum: 999999999999.99
          description: |
            Wajib bila `value_mode` = `fixed`. Pesan error: "Nominal wajib diisi untuk nilai tetap." / "Nominal
            harus lebih dari 0." / "Nominal maksimal Rp 999.999.999.999,99." / "Nominal maksimal 2 angka di belakang
            koma."
          example: null

    UpdateEventSlotsRequest:
      type: object
      required: [slots]
      properties:
        slots:
          type: array
          maxItems: 20
          description: Seluruh slot proyek, urut sesuai funnel. Lebih dari 20 → "Maksimal 20 slot per proyek."
          items:
            $ref: "#/components/schemas/EventSlotInput"
